services:
  db:
    image: postgres:17-alpine
    container_name: premium-app-sale-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-premium}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-premium_app_sale}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-premium} -d ${POSTGRES_DB:-premium_app_sale}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
